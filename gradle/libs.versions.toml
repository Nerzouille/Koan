[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
fragment = "1.9.1"
coroutines = "1.11.0"
room = "2.8.5"
biometric = "1.1.0"
ksp = "2.3.12"
# android-components and GeckoView must move together: AC X.Y depends on one exact GeckoView build.
mozillaComponents = "157.0.1"
geckoview = "157.0.20261005135250"
junit = "4.13.2"
datastore = "1.2.1"
androidsvg = "1.4"
orgJson = "20260814"

[libraries]
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }

geckoview = { module = "org.mozilla.geckoview:geckoview-omni", version.ref = "geckoview" }
mozilla-browser-engine-gecko = { module = "org.mozilla.components:browser-engine-gecko", version.ref = "mozillaComponents" }
mozilla-browser-state = { module = "org.mozilla.components:browser-state", version.ref = "mozillaComponents" }
mozilla-concept-engine = { module = "org.mozilla.components:concept-engine", version.ref = "mozillaComponents" }
mozilla-feature-session = { module = "org.mozilla.components:feature-session", version.ref = "mozillaComponents" }
mozilla-feature-tabs = { module = "org.mozilla.components:feature-tabs", version.ref = "mozillaComponents" }
mozilla-browser-session-storage = { module = "org.mozilla.components:browser-session-storage", version.ref = "mozillaComponents" }
mozilla-lib-state = { module = "org.mozilla.components:lib-state", version.ref = "mozillaComponents" }
mozilla-feature-readerview = { module = "org.mozilla.components:feature-readerview", version.ref = "mozillaComponents" }
mozilla-feature-downloads = { module = "org.mozilla.components:feature-downloads", version.ref = "mozillaComponents" }
mozilla-concept-storage = { module = "org.mozilla.components:concept-storage", version.ref = "mozillaComponents" }
mozilla-support-utils = { module = "org.mozilla.components:support-utils", version.ref = "mozillaComponents" }
mozilla-support-webextensions = { module = "org.mozilla.components:support-webextensions", version.ref = "mozillaComponents" }

junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
